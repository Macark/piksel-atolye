  <section class="screen" id="cam">
    <div class="top">
      <button class="icon box" id="camBack" type="button" aria-label="Ana sayfa"><svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M4 1h1v1h-1zM3 2h1v1h-1zM2 3h1v1h-1zM1 4h8v2h-8zM2 6h1v1h-1zM3 7h1v1h-1zM4 8h1v1h-1z"></path></svg></button>
      <span class="toptitle">KAMERA</span>
      <button class="icon box" id="camFlip" type="button" aria-label="Kamerayı çevir">
        <svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 1h5v1h-5zM1 2h1v3h-1zM7 0h1v1h1v1h1v1h-1v1h-1v1h-1zM4 9h5v1h-5zM9 6h1v3h-1zM3 6h1v5h-1v-1h-1v-1h-1v-1h1v-1h1z"></path></svg>
      </button>
    </div>
    <div class="camwrap">
      <div class="camview" id="camView">
        <video id="camVid" playsinline muted></video>
        <span class="camguide" aria-hidden="true"></span>
        <p class="camhint">Yüzünü çerçeveye getir. Aksesuarı çektikten sonra seçeceksin.</p>
      </div>
      <div class="camfall" id="camFall" hidden>
        <p>Kamera burada açılamadı. Telefonunun kamerasıyla çekebilir ya da galeriden bir fotoğraf seçebilirsin.</p>
        <label class="btn primary">TELEFON KAMERASI<input type="file" accept="image/*" capture="user" class="fileIn"></label>
        <label class="btn">GALERİDEN SEÇ<input type="file" accept="image/*" class="fileIn"></label>
      </div>
    </div>
    <div style="padding:6px 20px 18px"><button class="btn primary" id="shutter" type="button">ÇEK</button></div>
  </section>
